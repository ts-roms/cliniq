# ClinIQ local development stack.
#
# Brings up postgres → runs prisma migrations once → starts api + ai-service +
# web. Migrations are an explicit one-shot service so they don't race the api
# on cold boot. All services share the workspace `.env` (copy `.env.example`
# to `.env` first).
#
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose logs -f api          # tail any service
#   docker compose run --rm migrate     # re-run migrations after a schema change
#   docker compose down                 # stop (keeps the postgres volume)
#   docker compose down -v              # stop + wipe data

name: cliniq

services:
  postgres:
    image: postgres:16-alpine
    container_name: cliniq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cliniq}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-cliniq-app-role.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cliniq}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot prisma migrate. `service_completed_successfully` blocks api/web
  # boot until this finishes, so the first request never races a half-applied
  # schema. Re-run manually after schema changes:
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: docker/migrate.Dockerfile
    container_name: cliniq-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Migrations run as the postgres superuser so RLS policies + role grants
      # in the `20260501000001_rls_policies` migration can take effect.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cliniq}?schema=public
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cliniq-api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      # App connects via the cliniq_app role so RLS policies engage.
      DATABASE_URL: postgresql://cliniq_app:cliniq_app@postgres:5432/${POSTGRES_DB:-cliniq}?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      AI_SERVICE_URL: http://ai-service:4100
      # Shared secret for ai-service (its ServiceAuthGuard). Same value on
      # both services. The dev default is fine on a laptop, not anywhere else.
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token-change-me}
      PORTAL_BASE_URL: ${PORTAL_BASE_URL:-http://localhost:4000}
      # Behind a reverse proxy set TRUST_PROXY=1 so rate limits key on the
      # real client ip (X-Forwarded-For) rather than the proxy's.
      TRUST_PROXY: ${TRUST_PROXY:-}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-10}
      # Session cookies. NODE_ENV=production defaults Secure to on, which is
      # right for a real deploy but means WebKit/Safari silently drops the
      # cookie on plain http://localhost — so the local stack can't be driven
      # from Safari or the webkit Playwright project without this opt-out.
      # Set COOKIE_SECURE=false ONLY for local http.
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-}
      # Optional integration env. Mailer/Sms/TURN go no-op when unset.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
      APPT_REMINDERS_ENABLED: ${APPT_REMINDERS_ENABLED:-false}
      APPT_AUTO_NOSHOW_ENABLED: ${APPT_AUTO_NOSHOW_ENABLED:-false}
      APPT_NOSHOW_GRACE_MINUTES: ${APPT_NOSHOW_GRACE_MINUTES:-30}
    ports:
      - '${API_PORT:-4005}:4000'

  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: cliniq-ai-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4100
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token-change-me}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      # Bedrock creds are optional in dev — when missing, ai-service falls
      # back to stub responses for the SOAP/derm endpoints.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      BEDROCK_MODEL_SOAP: ${BEDROCK_MODEL_SOAP:-}
      BEDROCK_MODEL_DERM: ${BEDROCK_MODEL_DERM:-}
    ports:
      - '${AI_PORT:-4300}:4100'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is inlined by `next build` at build time. The Dockerfile
      # declares `ARG NEXT_PUBLIC_API_URL` — we MUST forward it here, otherwise
      # the client bundle ships with an empty baseUrl and login fetches resolve
      # to the web's own origin (404 on /api/auth/login).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4005}
    container_name: cliniq-web
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3000
      # Kept for SSR / server components that may read process.env at runtime.
      # The client bundle was already baked at build time via build.args above.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4005}
    ports:
      - '${WEB_PORT:-4000}:3000'

volumes:
  postgres-data:
    name: cliniq-postgres-data
