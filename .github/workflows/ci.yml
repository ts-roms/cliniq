name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  actions: read
  contents: read

env:
  PNPM_VERSION: '10'
  NODE_VERSION: '22'

jobs:
  # ────────────────────────────────────────────────────────────
  # Lint + typecheck + unit tests + build for affected projects.
  # Postgres service runs so the API + db tests have a real DB.
  # ────────────────────────────────────────────────────────────
  affected:
    name: Lint / test / build (affected)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cliniq
          POSTGRES_PASSWORD: cliniq
          POSTGRES_DB: cliniq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cliniq -d cliniq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cliniq:cliniq@localhost:5432/cliniq_test?schema=public
      DATABASE_URL_APP: postgresql://cliniq_app:cliniq_app@localhost:5432/cliniq_test?schema=public
      JWT_SECRET: test-secret-must-be-at-least-32-characters-long
      NX_CLOUD_DISTRIBUTED_EXECUTION: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Set the SHAs Nx will use for `nx affected`
      - uses: nrwl/nx-set-shas@v4

      # Both generated clients are gitignored, and `@org/db:build` /
      # `@org/web:test` / `@org/mobile:test` import them — without this the
      # test step dies with "Cannot find module './generated/...'".
      # The api-client is regenerated from the committed openapi.json
      # snapshot (same as apps/web/Dockerfile) rather than via the nx
      # `generate` target, which would need an api build against a live DB.
      - name: Generate Prisma client + apply migrations
        working-directory: libs/db
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Generate OpenAPI api-client from the committed snapshot
        working-directory: libs/api-client
        run: |
          pnpm exec openapi-ts
          node scripts/strip-js-extensions.mjs

      - name: Provision cliniq_app role for RLS tests
        env:
          PGPASSWORD: cliniq
        run: |
          psql -h localhost -U cliniq -d cliniq_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cliniq_app') THEN CREATE ROLE cliniq_app LOGIN PASSWORD 'cliniq_app'; END IF; END \$\$;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT USAGE ON SCHEMA public TO cliniq_app;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO cliniq_app;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO cliniq_app;"

      - name: Sync Nx project references
        run: pnpm exec nx sync:check || pnpm exec nx sync

      - name: Format check
        run: pnpm exec nx format:check

      - name: Lint (affected)
        run: pnpm exec nx affected -t lint --parallel=3

      - name: Test (affected, includes RLS leak test)
        run: pnpm exec nx affected -t test --parallel=3

      - name: Build (affected)
        run: pnpm exec nx affected -t build --parallel=3

  # ────────────────────────────────────────────────────────────
  # Boot the built api binary against a real Postgres + run the
  # end-to-end smoke script. Catches runtime regressions that
  # `nx test` (unit) can't see — wiring, auth, real CRUD, RLS.
  # ────────────────────────────────────────────────────────────
  api-integration:
    name: API integration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: affected

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cliniq
          POSTGRES_PASSWORD: cliniq
          POSTGRES_DB: cliniq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cliniq -d cliniq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cliniq:cliniq@localhost:5432/cliniq_test?schema=public
      DATABASE_URL_APP: postgresql://cliniq_app:cliniq_app@localhost:5432/cliniq_test?schema=public
      JWT_SECRET: integration-test-secret-must-be-32-chars-long-yes-it-is
      NODE_ENV: production
      PORT: '4000'
      CORS_ORIGINS: http://localhost:3000
      # The e2e suite hammers the credential endpoints from one ip; the
      # default 10/min auth bucket would 429 it. Keep throttling ON (so the
      # guard is exercised) but with a ceiling the suite can't reach.
      THROTTLE_AUTH_LIMIT: '1000'
      THROTTLE_LIMIT: '5000'
      # Lets auth-hardening.spec.ts complete the reset flow without an inbox.
      AUTH_EXPOSE_DEBUG_TOKENS: 'true'
      AI_SERVICE_TOKEN: ci-only-ai-service-token-not-a-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '10' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        working-directory: libs/db
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Provision cliniq_app role
        env: { PGPASSWORD: cliniq }
        run: |
          psql -h localhost -U cliniq -d cliniq_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cliniq_app') THEN CREATE ROLE cliniq_app LOGIN PASSWORD 'cliniq_app'; END IF; END \$\$;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT USAGE ON SCHEMA public TO cliniq_app;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO cliniq_app;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO cliniq_app;"

      - name: Build api
        run: pnpm exec nx run @org/api:build

      - name: Boot stub-ai-service in background
        run: |
          node apps/api-e2e/src/integration/stub-ai-service.mjs > ai.log 2>&1 &
          echo $! > ai.pid

      # The api must run as the RLS role: PrismaService refuses to boot as a
      # superuser / BYPASSRLS role (the owner `cliniq` URL stays job-wide for
      # migrations and the e2e harness's direct fixture/cleanup connection).
      - name: Boot api in background
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_APP }}
          AI_SERVICE_URL: http://localhost:4100
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid

      - name: Run smoke
        env:
          API_URL: http://localhost:4000
        run: node apps/api-e2e/src/integration/smoke.mjs

      - name: Run api e2e suite (Jest, real HTTP + RLS)
        env:
          API_E2E_URL: http://localhost:4000
        run: pnpm exec nx run @org/api-e2e:e2e --skip-nx-cache

      - name: Stop services
        if: always()
        run: |
          if [[ -f api.pid ]]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
          if [[ -f ai.pid ]];  then kill "$(cat ai.pid)"  2>/dev/null || true; fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-logs
          path: |
            api.log
            ai.log
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────
  # Build the api Docker image on every PR for sanity. On main,
  # the cd.yml workflow pushes it to ECR and deploys.
  # ────────────────────────────────────────────────────────────
  docker-api:
    name: Build api image (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: cliniq-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────
  # Playwright web e2e — boots api + web + Postgres, then runs
  # specs across chromium / firefox / webkit. Per the e2e plan:
  # full browser matrix on every PR (cross-browser confidence)
  # plus the responsive viewport sweep + a11y smoke.
  # ────────────────────────────────────────────────────────────
  web-e2e:
    name: Web e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: affected
    # The Playwright suite landed with the May-2026 wip and has not yet been
    # run green end-to-end in CI. Keep it visible but non-blocking until it
    # is; flip this off once a run passes (docs/audit-checklist.md P3).
    continue-on-error: true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cliniq
          POSTGRES_PASSWORD: cliniq
          POSTGRES_DB: cliniq_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cliniq -d cliniq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cliniq:cliniq@localhost:5432/cliniq_test?schema=public
      DATABASE_URL_APP: postgresql://cliniq_app:cliniq_app@localhost:5432/cliniq_test?schema=public
      JWT_SECRET: webe2e-secret-must-be-32-chars-long-yes-it-is
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SAMESITE: lax
      THROTTLE_AUTH_LIMIT: '1000'
      THROTTLE_LIMIT: '5000'
      AI_SERVICE_TOKEN: ci-only-ai-service-token-not-a-secret
      WEB_E2E_BASE_URL: http://localhost:3000
      API_E2E_URL: http://localhost:4000
      PW_NO_WEBSERVERS: '1' # we boot api + web ourselves below

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: '10' }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Apply migrations
        working-directory: libs/db
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Provision cliniq_app role
        env: { PGPASSWORD: cliniq }
        run: |
          psql -h localhost -U cliniq -d cliniq_test -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cliniq_app') THEN CREATE ROLE cliniq_app LOGIN PASSWORD 'cliniq_app'; END IF; END \$\$;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT USAGE ON SCHEMA public TO cliniq_app;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO cliniq_app;"
          psql -h localhost -U cliniq -d cliniq_test -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO cliniq_app;"

      - name: Build api
        run: pnpm exec nx run @org/api:build

      - name: Generate OpenAPI api-client from the committed snapshot
        working-directory: libs/api-client
        run: |
          pnpm exec openapi-ts
          node scripts/strip-js-extensions.mjs

      - name: Build web (production)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: pnpm exec nx run @org/web:build

      # The api must run as the RLS role: PrismaService refuses to boot as a
      # superuser / BYPASSRLS role (the owner `cliniq` URL stays job-wide for
      # migrations and the e2e harness's direct fixture/cleanup connection).
      - name: Boot api in background
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_APP }}
          PORT: '4000'
        run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid

      - name: Boot web in background
        env:
          PORT: '3000'
          NEXT_PUBLIC_API_URL: http://localhost:4000
          HOSTNAME: '0.0.0.0'
        run: |
          # `next start` runs the production server. We launch from the web
          # app's directory so the build output is found correctly.
          (cd apps/web && pnpm exec next start -p 3000 > ../../web.log 2>&1) &
          echo $! > web.pid

      - name: Wait for api
        run: |
          for i in {1..40}; do
            if curl -fsS http://localhost:4000/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:4000/api/health

      - name: Wait for web
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then break; fi
            sleep 2
          done

      - name: Run Playwright suite
        run: pnpm exec nx run @org/web-e2e:e2e --skip-nx-cache
        env:
          CI: 'true'

      - name: Stop services
        if: always()
        run: |
          if [[ -f api.pid ]]; then kill "$(cat api.pid)" 2>/dev/null || true; fi
          if [[ -f web.pid ]]; then kill "$(cat web.pid)" 2>/dev/null || true; fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report
          if-no-files-found: ignore

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-server-logs
          path: |
            api.log
            web.log
          if-no-files-found: ignore
