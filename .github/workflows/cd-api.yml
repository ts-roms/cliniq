name: CD — api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'libs/db/**'
      - 'libs/auth/**'
      - 'libs/shared-types/**'
      - 'pnpm-lock.yaml'
      - 'apps/api/Dockerfile'
      - '.github/workflows/cd-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: cd-api-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for AWS OIDC

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build api artifact
        run: pnpm exec nx run @org/api:build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: cliniq-${{ env.ENVIRONMENT }}-api
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${REPO}:${SHA}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run Prisma migrations against target env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --dir libs/db exec prisma migrate deploy

      - name: Render new ECS task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/cliniq-${{ env.ENVIRONMENT }}-api.task-def.json
          container-name: api
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: cliniq-${{ env.ENVIRONMENT }}-api
          cluster: cliniq-${{ env.ENVIRONMENT }}-cluster
          wait-for-service-stability: true
          wait-for-minutes: 10
