name: CD — api

# AWS deploys are paused: the project currently runs locally + GitHub only
# (no AWS access yet). Only manual dispatch is enabled; restore the commented
# trigger below once infra/bootstrap has run and AWS_DEPLOY_ROLE_ARN is set.
on:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'apps/api/**'
  #     - 'libs/db/**'
  #     - 'libs/auth/**'
  #     - 'libs/shared-types/**'
  #     - 'pnpm-lock.yaml'
  #     - 'apps/api/Dockerfile'
  #     - '.github/workflows/cd-api.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]

concurrency:
  group: cd-api-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # for AWS OIDC

env:
  AWS_REGION: ap-southeast-1
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      # `secrets` is not usable in a job-level `if`, so expose it as an env flag
      # and gate every AWS step on it: until infra/bootstrap has run and the
      # AWS_DEPLOY_ROLE_ARN secret is set, the job still builds but skips deploy.
      AWS_CONFIGURED: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: '11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir libs/db exec prisma generate

      - name: Build api artifact
        run: pnpm exec nx run @org/api:build

      - name: Deploy skipped (AWS not configured)
        if: env.AWS_CONFIGURED != 'true'
        run: echo "::warning::AWS_DEPLOY_ROLE_ARN secret is not set - built OK but skipping ECR push/ECS deploy. See infra/bootstrap/README.md."

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_CONFIGURED == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.AWS_CONFIGURED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        if: env.AWS_CONFIGURED == 'true'
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: cliniq-${{ env.ENVIRONMENT }}-api
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${REPO}:${SHA}"
          docker build -f apps/api/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Run Prisma migrations against target env
        if: env.AWS_CONFIGURED == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --dir libs/db exec prisma migrate deploy

      - name: Render new ECS task definition
        if: env.AWS_CONFIGURED == 'true'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/cliniq-${{ env.ENVIRONMENT }}-api.task-def.json
          container-name: api
          image: ${{ steps.build.outputs.image }}

      - name: Deploy to ECS
        if: env.AWS_CONFIGURED == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: cliniq-${{ env.ENVIRONMENT }}-api
          cluster: cliniq-${{ env.ENVIRONMENT }}-cluster
          wait-for-service-stability: true
          wait-for-minutes: 10
