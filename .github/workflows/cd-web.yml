name: CD — web (Next.js)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'libs/ui/**'
      - 'libs/shared-types/**'
      - 'libs/api-client/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cd-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-1

jobs:
  build:
    name: Build & deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` is not usable in a job-level `if`, so expose it as an env flag
      # and gate every AWS step on it: until infra/bootstrap has run and the
      # AWS_DEPLOY_ROLE_ARN secret is set, the job still builds but skips deploy.
      AWS_CONFIGURED: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: '11'

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client + OpenAPI api-client
        run: |
          pnpm --dir libs/db exec prisma generate
          pnpm --dir libs/api-client exec openapi-ts
          (cd libs/api-client && node scripts/strip-js-extensions.mjs)

      - name: Build
        run: pnpm exec nx run @org/web:build

      # Option A — Vercel (uncomment if hosting there)
      # - uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
      #     working-directory: apps/web
      #     vercel-args: '--prod'

      # Option B — push container to ECR like the api (current default).
      - name: Deploy skipped (AWS not configured)
        if: env.AWS_CONFIGURED != 'true'
        run: echo "::warning::AWS_DEPLOY_ROLE_ARN secret is not set - built OK but skipping ECR push/ECS deploy. See infra/bootstrap/README.md."

      - name: Configure AWS
        if: env.AWS_CONFIGURED == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: env.AWS_CONFIGURED == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        if: env.AWS_CONFIGURED == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPO: cliniq-dev-web
          SHA: ${{ github.sha }}
        run: |
          IMAGE="${REGISTRY}/${REPO}:${SHA}"
          docker build -f apps/web/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "Pushed $IMAGE"
