packages:
  - 'packages/*'
  - 'apps/*'
  - 'libs/*'
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  core-js: true
  detox: true
  dtrace-provider: true
  esbuild: true
  less: true
  nx: true
  prisma: true
  sharp: true
  unrs-resolver: true
